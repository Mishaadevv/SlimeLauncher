<!doctype html>
<html lang="en">
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>Minecraft Console</title>
 </head>
 <body>
    <div id="console-app">
      <header id="console-header">
        <div class="console-dots">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
        <div class="console-title" id="console-title">Minecraft Console</div>
        <div class="console-actions">
          <button id="console-copy" class="console-btn" title="Copy log to clipboard">Copy</button>
          <button id="console-close" class="console-btn" title="Close">Close</button>
        </div>
      </header>
      <div id="console-meta" class="console-meta"></div>
      <pre id="console-output" class="console-output"></pre>
      <footer class="console-footer" id="console-footer"></footer>
    </div>
    <script type="module" src="./console.ts"></script>
 </body>
</html>
